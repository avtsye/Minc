name: Import upstream repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Clone upstream
        run: |
          git clone --depth=1 https://github.com/eladjmc/Mincraft-Game.git /tmp/upstream

      - name: Copy upstream contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/upstream/. .
          rm -rf .git
          # restore target repository git metadata
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout -B main origin/main
          # overwrite working tree from upstream again, while keeping this importer until commit
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/upstream/. .
          rm -rf .git
          mkdir -p .github/workflows
          cp "${GITHUB_WORKSPACE}/.github/workflows/import-upstream.yml" .github/workflows/import-upstream.yml 2>/dev/null || true

      - name: Commit imported repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import eladjmc/Mincraft-Game"
          git push origin main
